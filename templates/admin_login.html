{% extends "base.html" %}
{% block title %}Admin login | Creatora AI{% endblock %}
{% block content %}
<section class="auth-layout section-wrap">
    <div class="auth-aside">
        <span class="eyebrow">ADMINISTRATION</span>
        <h1>Welcome back,<br><span class="text-gradient">admin.</span></h1>
        <p class="lead">Sign in with your administrator account to review platform activity.</p>
    </div>
    <form class="surface-card auth-card" method="post" action="{{ url_for('login', next=url_for('admin_dashboard')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <span class="eyebrow">ADMIN WORKSPACE</span>
        <h2>Admin sign in.</h2>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="button button-full" type="submit">Sign in to admin <span aria-hidden="true">↗</span></button>
        <a class="text-link" href="{{ url_for('login') }}">Return to regular login</a>
    </form>
</section>
{% endblock %}
